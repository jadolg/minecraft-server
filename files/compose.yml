services:
  mc:
    image: itzg/minecraft-server:java25
    pull_policy: daily
    restart: unless-stopped
    ports:
      - "25565:25565"
      - "8100:8100"
    environment:
      EULA: "TRUE"
      TYPE: FABRIC
      MODRINTH_PROJECTS: |
        fabric-api
        bluemap
      VERSION: "26.3"
      MEMORY: "6G"
      DIFFICULTY: "hard"
      MOTD: "Chiki & Lisi's server"
      ENABLE_WHITELIST: "true"
      WHITELIST: "chikitica91,lisiperez95"
      OPS: "chikitica91,lisiperez95"
    volumes:
      - ./data:/data
